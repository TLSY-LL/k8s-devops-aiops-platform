apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: emergency-alerts
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  groups:
  - name: cluster-emergency
    rules:
    - alert: APIServerThrottling
      expr: sum(rate(apiserver_flowcontrol_rejected_requests_total[1m])) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "\U0001F6A8 API Server \u6B63\u5728\u9650\u6D41 (429)\uFF01"
        description: "\u6709\u5927\u91CF\u8BF7\u6C42\u88AB APF \u62D2\u7EDD\uFF0C\u53EF\
          \u80FD\u5BFC\u81F4\u63A7\u5236\u9762\u5047\u6B7B\u3002\u8BF7\u7ACB\u523B\
          \u68C0\u67E5\u662F\u5426\u6709 Watch \u98CE\u66B4\u3002"
    - alert: EtcdHighLatency
      expr: histogram_quantile(0.99, sum(rate(etcd_request_duration_seconds_bucket[5m]))
        by (le)) > 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "\U0001F6A8 Etcd \u54CD\u5E94\u5EF6\u8FDF\u6781\u9AD8"
        description: "Etcd P99 \u5EF6\u8FDF\u8D85\u8FC7 1 \u79D2\uFF0C\u7269\u7406\
          \u673A\u78C1\u76D8 IO \u53EF\u80FD\u5DF2\u8FBE\u74F6\u9888\uFF0C\u6781\u6613\
          \u5F15\u53D1\u96EA\u5D29\u3002"
    - alert: NodeMemoryPressure
      expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 <
        10
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "\u26A0\uFE0F \u8282\u70B9\u5185\u5B58\u53EF\u7528\u7387\u4F4E\u4E8E\
          \ 10%"
        description: "\u8282\u70B9 {{ $labels.instance }} \u5185\u5B58\u5373\u5C06\
          \u8017\u5C3D\uFF0C\u53EF\u80FD\u89E6\u53D1 Swap \u751A\u81F3\u7CFB\u7EDF\
          \u6B7B\u9501\u3002"
