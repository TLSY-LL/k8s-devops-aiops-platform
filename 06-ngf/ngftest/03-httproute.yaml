apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ngfapp-httproute
  namespace: default
spec:
  parentRefs:
    - name: nginx-gateway-test
      sectionName: http
  hostnames:
    - "www.kubex.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ngfapp-svc
          kind: Service
          port: 80
