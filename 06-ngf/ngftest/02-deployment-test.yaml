apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngf-test-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ngfapp
  template:
    metadata:
      labels:
        app: ngfapp
    spec:
      containers:
      - name: ngfapp
        image: nginx:latest
        ports:
        - containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  name: ngfapp-svc
spec:
  type: ClusterIP
  selector:
    app: ngfapp
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
